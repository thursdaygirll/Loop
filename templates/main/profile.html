{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop — Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand:        '#87CEEB',
                        'brand-lt':   '#6EC6F5',
                        'page-bg':    '#F0F4F8',
                        'card-bg':    '#E6F0FA',
                        navy:         '#1a2942',
                        'text-pri':   '#222222',
                        'text-sec':   '#555555',
                        'text-muted': '#888888',
                        'border-col': '#e8ecf0',
                        danger:       '#F87171',
                    }
                }
            }
        }
    </script>
    <style>
        .nav-link { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; color:rgba(255,255,255,.5); font-size:13px; font-weight:500; text-decoration:none; transition:all .15s; }
        .nav-link:hover { color:rgba(255,255,255,.9); background:rgba(255,255,255,.07); }
        .nav-link.active { color:#fff; background:rgba(255,255,255,.12); }
        .nav-icon { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08); flex-shrink:0; }
        .nav-link.active .nav-icon { background:rgba(135,206,235,.2); }
        #sidebar { transition: transform 0.25s ease; }
        #main-content { transition: margin-left 0.25s ease; }
    </style>
</head>
<body class="bg-page-bg font-sans text-text-pri min-h-screen">
<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" class="hidden lg:flex flex-col w-56 min-h-screen fixed left-0 top-0 bottom-0 z-30 bg-navy" style="box-shadow:2px 0 20px rgba(0,0,0,.15);">
        <div class="flex items-center gap-3 px-4 py-5 border-b border-white/5 mb-2">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style="background:rgba(135,206,235,.12);border:1px solid rgba(135,206,235,.18);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M21 12a9 9 0 1 1-9-9" stroke="#87CEEB" stroke-width="2.4" stroke-linecap="round"/>
                    <path d="M12 3l3.5 3.5L12 10" stroke="#87CEEB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="text-white font-bold text-lg flex-1">Loop</span>
            <button onclick="toggleSidebar()" class="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white/10 transition flex-shrink-0" title="Ocultar menú">
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="rgba(255,255,255,.5)" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
        </div>
        <nav class="flex flex-col gap-0.5 flex-1 px-3">
            <a href="/dashboard/" class="nav-link">
                <div class="nav-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
                Inicio
            </a>
            <a href="/habits/" class="nav-link">
                <div class="nav-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div>
                Hábitos
            </a>
            <a href="/profile/" class="nav-link active">
                <div class="nav-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
                Perfil
            </a>
        </nav>
        <div class="px-3 pb-5">
            <a href="/logout/" class="nav-link">
                <div class="nav-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg></div>
                Cerrar sesión
            </a>
        </div>
    </aside>

    <!-- Sidebar re-open button -->
    <button id="sidebar-open-btn" onclick="toggleSidebar()"
        class="hidden fixed top-5 left-3 z-40 w-9 h-9 rounded-xl bg-navy items-center justify-center shadow-lg hover:opacity-90 transition"
        style="display:none;" title="Mostrar menú">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="rgba(255,255,255,.8)" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
    </button>

    <!-- Mobile topbar -->
    <div class="lg:hidden fixed top-0 inset-x-0 z-30 bg-navy flex items-center justify-between px-4 py-3" style="box-shadow:0 2px 10px rgba(0,0,0,.2);">
        <div class="flex items-center gap-2">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-9-9" stroke="#87CEEB" stroke-width="2.4" stroke-linecap="round"/><path d="M12 3l3.5 3.5L12 10" stroke="#87CEEB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="text-white font-bold">Loop</span>
        </div>
        <div class="flex gap-4 items-center">
            <a href="/dashboard/" class="text-white/60"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
            <a href="/habits/" class="text-white/60"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></a>
        </div>
    </div>

    <!-- Main -->
    <main id="main-content" class="flex-1 lg:ml-56 pt-14 lg:pt-0 min-h-screen flex flex-col">

        <!-- Header band -->
        <div class="bg-navy px-6 sm:px-8 pt-8 pb-16">
            <p class="text-xs font-semibold uppercase tracking-widest text-brand-lt opacity-80 mb-2">Tu cuenta</p>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Mi perfil</h1>
        </div>

        <!-- Card lifts over header -->
        <div class="px-6 sm:px-8 pb-12 -mt-10 flex flex-col items-center">
            <div class="w-full max-w-md">

                <div class="bg-white rounded-2xl shadow-lg border border-border-col overflow-hidden">

                    <!-- Avatar section -->
                    <div class="flex flex-col items-center px-8 pt-8 pb-6 border-b border-border-col">
                        <div class="relative mb-4">
                            <img src="{{ photo_url }}" alt="Foto de perfil"
                                 class="w-24 h-24 rounded-full object-cover"
                                 style="outline:4px solid #E6F0FA;outline-offset:2px;">
                            <div class="absolute bottom-0.5 right-0.5 w-6 h-6 rounded-full bg-brand border-2 border-white flex items-center justify-center">
                                <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            </div>
                        </div>
                        <h2 class="text-lg font-bold text-text-pri text-center">{{ name }}</h2>
                        <p class="text-sm text-text-muted text-center mt-1">{{ email }}</p>
                    </div>

                    <!-- Edit form -->
                    <div class="px-8 py-7">
                        <p class="text-xs font-semibold uppercase tracking-widest text-text-sec mb-5">Editar información</p>

                        {% if success %}
                        <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm mb-4">
                            {{ success }}
                        </div>
                        {% endif %}
                        {% if error %}
                        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mb-4">
                            {{ error }}
                        </div>
                        {% endif %}

                        <form method="post" action="{% url 'update_profile' %}">
                            {% csrf_token %}
                            <input type="hidden" name="user_id" value="{{ user_id }}">

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-text-sec mb-1.5">Nombre</label>
                                <input type="text" name="display_name" value="{{ name }}" placeholder="Tu nombre"
                                    class="w-full px-4 py-3 rounded-xl border border-border-col bg-gray-50 font-sans text-sm text-text-pri outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition">
                            </div>

                            <div class="mb-6">
                                <label class="block text-sm font-medium text-text-sec mb-1.5">Correo electrónico</label>
                                <input type="email" value="{{ email }}" disabled
                                    class="w-full px-4 py-3 rounded-xl border border-border-col bg-gray-100 font-sans text-sm text-text-muted cursor-not-allowed">
                                <p class="text-xs text-text-muted mt-1.5">El correo no se puede cambiar desde aquí.</p>
                            </div>

                            <button type="submit"
                                class="w-full py-3 rounded-xl bg-brand text-white font-semibold text-sm hover:bg-brand-lt transition">
                                Guardar cambios
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script>
    const SIDEBAR_KEY = 'loopSidebarOpen';
    let sidebarOpen = localStorage.getItem(SIDEBAR_KEY) !== 'false';

    function updateSidebar() {
        const sidebar = document.getElementById('sidebar');
        const main    = document.getElementById('main-content');
        const openBtn = document.getElementById('sidebar-open-btn');
        if (!sidebar) return;
        if (sidebarOpen) {
            sidebar.style.transform = '';
            main.style.marginLeft = '';
            openBtn.style.display = 'none';
        } else {
            sidebar.style.transform = 'translateX(-100%)';
            main.style.marginLeft = '0';
            openBtn.style.display = 'flex';
        }
    }

    function toggleSidebar() {
        sidebarOpen = !sidebarOpen;
        localStorage.setItem(SIDEBAR_KEY, sidebarOpen);
        updateSidebar();
    }

    document.addEventListener('DOMContentLoaded', updateSidebar);
</script>
</body>
</html>
