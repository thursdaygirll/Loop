{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] },
                    colors: {
                        'brand-sky': '#87CEEB',
                        'brand-sky-light': '#6EC6F5',
                        'text-primary': '#222222',
                        'text-secondary': '#666666',
                        'accent-blue': '#4a90e2',
                        'danger': '#F87171',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center font-sans"
      style="background: url('{% static 'main/login-bg.png' %}') no-repeat center center/cover;">
    <div class="bg-white rounded-[2.5rem] shadow-xl p-6 sm:p-12 w-full max-w-xs sm:max-w-xl flex flex-col items-center"
         style="box-shadow: 0 8px 32px 0 rgba(0,0,0,0.10);">
        <h1 class="text-4xl font-bold text-brand-sky mb-2 mt-4">Loop</h1>
        <p class="mb-6 text-center text-text-secondary text-sm">Crea tu cuenta para empezar a usar Loop.</p>

        {% if error %}
        <div class="bg-red-50 border border-danger text-danger px-4 py-3 rounded-xl mb-4 w-full text-sm">
            {{ error }}
        </div>
        {% endif %}
        {% if success %}
        <div class="bg-green-50 border border-green-400 text-green-700 px-4 py-3 rounded-xl mb-4 w-full text-sm">
            {{ success }}
        </div>
        {% endif %}

        <form action="{% url 'register' %}" method="post" class="w-full flex flex-col gap-4">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" name="display_name" placeholder="Nombre"
                       class="flex-1 p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-sky" required />
                <input type="text" name="last_name" placeholder="Apellido"
                       class="flex-1 p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-sky" required />
            </div>
            <input type="email" name="email" placeholder="Correo electrónico"
                   class="p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-sky" required />
            <input type="password" name="password" placeholder="Contraseña"
                   class="p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-sky" required />
            <input type="password" name="confirm_password" placeholder="Confirmar contraseña"
                   class="p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-sky" required />
            <button type="submit"
                    class="bg-brand-sky text-white rounded-xl py-4 text-base font-semibold mt-2 transition hover:bg-brand-sky-light shadow-md">
                Crear cuenta
            </button>
        </form>

        <p class="mt-4 text-text-secondary text-sm">
            ¿Ya tienes cuenta?
            <a href="{% url 'login' %}" class="text-accent-blue underline font-medium">Iniciar sesión</a>
        </p>
    </div>
</body>
</html>
